services:
  - type: web
    name: elimfilters-youtube-bot
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: YOUTUBE_CHANNEL_ID
        value: "@elimfilters9112"
      - key: YOUTUBE_API_KEY
        sync: false
      - key: YOUTUBE_OAUTH_CLIENT_ID
        sync: false
      - key: YOUTUBE_OAUTH_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_OAUTH_REFRESH_TOKEN
        sync: false
      - key: YOUTUBE_VERIFY_TOKEN
        generateValue: true
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3-super-120b-a12b
      - key: DRY_RUN
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: elimfilters-instagram-db
          property: connectionString
      - key: NVIDIA_NIM_API_KEY
        sync: false
      # Knowledge System Integration
      - key: KNOWLEDGE_CENTER_API_URL
        value: https://knowledge-center-api-staging.onrender.com
      - key: KNOWLEDGE_CENTER_API_KEY
        value: 7dbfe0ccc6fa56e6ca54470e3ed5e1d6e4b4e28c07d6cc5a083e6ecc5f60a68c
      - key: KNOWLEDGE_ENGINE_RUNTIME_URL
        value: https://knowledge-engine-runtime-staging.onrender.com
      - key: ENGINE_API_KEY
        value: 93ce3ebe855277527c8b9c9df404d495492fa058e0def67cd5699823e10e6130
