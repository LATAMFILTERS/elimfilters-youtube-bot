services:
  - type: web
    name: elimfilters-youtube-bot
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: YOUTUBE_CHANNEL_ID
        value: "@elimfilters9112"
      - key: YOUTUBE_API_KEY
        sync: false
      - key: YOUTUBE_VERIFY_TOKEN
        generateValue: true
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3-super-120b-a12b
      - key: DRY_RUN
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: elimfilters-instagram-db
          property: connectionString
      - key: NVIDIA_NIM_API_KEY
        sync: false
